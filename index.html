const root=document.getElementById('mission'),video=document.getElementById('drive'),button=document.getElementById('launch'),status=document.getElementById('status');let timers=[];function later(fn,ms){timers.push(setTimeout(fn,ms))}function reset(){timers.forEach(clearTimeout);timers=[];video.pause();video.currentTime=0;root.className='mission';status.textContent='READY FOR LAUNCH';button.disabled=false;button.textContent='🚀 LAUNCH MISSION'}function fly(){root.className='mission flying';status.textContent='LIFTOFF · BOOST ACTIVATED';later(()=>{root.className='mission space';status.textContent='SPACE MISSION · ORBIT REACHED';button.disabled=false;button.textContent='↻ REPLAY MISSION'},6100)}button.addEventListener('click',()=>{reset();button.disabled=true;button.textContent='MISSION IN PROGRESS';root.className='mission running';status.textContent='START ENGINE · ACCELERATING';const p=video.play();if(p&&p.catch)p.catch(()=>{status.textContent='BOOST ACTIVATED';later(fly,1600)});later(()=>{video.pause();fly()},5800)});video.addEventListener('error',()=>{if(root.classList.contains('running'))fly()});
